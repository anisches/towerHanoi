<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower of Hanoi</title>
  <style>
    /* Dark (night) — default */
    :root {
      --bg: #292524;  /* tailwind stone-800 */
      --text: #ddd;
      --text-muted: #777;
      --text-faint: rgba(255,255,255,0.28);
      --debug-label: rgba(255,255,255,0.3);
      --debug-empty: rgba(255,255,255,0.2);
      --top-outline: rgba(255,255,255,0.7);
      --accent: #f0c060;
      --accent-glow: rgba(240,192,96,0.5);
      --accent-soft: rgba(240,192,96,0.12);
      --accent-mid: rgba(240,192,96,0.35);
      --accent-strong: rgba(240,192,96,0.45);
      --accent-hover: rgba(240,192,96,0.22);
      --panel-bg: rgba(255,255,255,0.07);
      --panel-bg-hover: rgba(255,255,255,0.14);
      --panel-border: rgba(255,255,255,0.14);
      --hud-grad: rgba(0,0,0,0.55);
      --win-overlay-bg: rgba(0,0,0,0.68);
      --win-card-bg: rgba(20,20,50,0.96);
      --win-card-shadow: 0 0 80px rgba(240,192,96,0.12), 0 20px 60px rgba(0,0,0,0.5);
      --win-text: #999;
      --win-text-strong: #eee;
    }

    /* Light (day) */
    body.light {
      --bg: #d6d3d1;
      --text: #2a2a3e;
      --text-muted: #555;
      --text-faint: rgba(20,20,40,0.45);
      --debug-label: rgba(20,20,40,0.5);
      --debug-empty: rgba(20,20,40,0.3);
      --top-outline: rgba(20,20,40,0.6);
      --accent: #a06b00;
      --accent-glow: rgba(160,107,0,0.35);
      --accent-soft: rgba(160,107,0,0.12);
      --accent-mid: rgba(160,107,0,0.35);
      --accent-strong: rgba(160,107,0,0.55);
      --accent-hover: rgba(160,107,0,0.22);
      --panel-bg: rgba(255,255,255,0.5);
      --panel-bg-hover: rgba(255,255,255,0.75);
      --panel-border: rgba(20,20,40,0.18);
      --hud-grad: rgba(255,255,255,0.45);
      --win-overlay-bg: rgba(255,255,255,0.55);
      --win-card-bg: rgba(255,255,255,0.96);
      --win-card-shadow: 0 0 80px rgba(160,107,0,0.18), 0 20px 60px rgba(20,20,40,0.2);
      --win-text: #555;
      --win-text-strong: #222;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.4s; }

    #canvas { display: block; }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(to bottom, var(--hud-grad), transparent);
      pointer-events: none;
    }

    #hud > * { pointer-events: all; }

    .hud-title {
      color: var(--accent);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    .hud-stats { display: flex; gap: 28px; }

    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .hud-stat label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .hud-stat span {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .hud-controls { display: flex; align-items: center; gap: 10px; }

    select, button {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      outline: none;
    }

    select:hover, button:hover { background: var(--panel-bg-hover); }
    select option { background: var(--bg); color: var(--text); }

    #hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-faint);
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    #debug-stacks {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 32px;
      pointer-events: none;
    }

    .debug-peg {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .debug-peg-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--debug-label);
    }

    .debug-disks {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .debug-disk {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: rgba(0,0,0,0.7);
    }

    .debug-disk.top {
      box-shadow: 0 0 0 2px var(--top-outline);
    }

    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--win-overlay-bg);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .win-card {
      background: var(--win-card-bg);
      border: 1px solid var(--accent-mid);
      border-radius: 18px;
      padding: 44px 68px;
      text-align: center;
      box-shadow: var(--win-card-shadow);
    }

    .win-card h2 {
      color: var(--accent);
      font-size: 2.5rem;
      margin-bottom: 16px;
      text-shadow: 0 0 30px var(--accent-glow);
    }

    .win-card p {
      color: var(--win-text);
      font-size: 0.95rem;
      margin-bottom: 5px;
      line-height: 1.6;
    }

    .win-card p strong { color: var(--win-text-strong); }

    #play-again-btn {
      margin-top: 28px;
      padding: 10px 36px;
      font-size: 0.95rem;
      background: var(--accent-soft);
      border-color: var(--accent-strong);
      color: var(--accent);
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    #play-again-btn:hover { background: var(--accent-hover); }

    #theme-toggle {
      position: fixed;
      bottom: 22px;
      right: 24px;
      padding: 6px 12px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }
    #theme-toggle:hover { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-title">TOWER OF HANOI</div>

    <div class="hud-stats">
      <div class="hud-stat">
        <label>Moves</label>
        <span id="moves">0</span>
      </div>
      <div class="hud-stat">
        <label>Minimum</label>
        <span id="min-moves">15</span>
      </div>
    </div>

    <div class="hud-controls">
      <select id="disk-count">
        <option value="3">3 disks</option>
        <option value="4" selected>4 disks</option>
        <option value="5">5 disks</option>
        <option value="6">6 disks</option>
        <option value="7">7 disks</option>
      </select>
      <button id="restart-btn">Restart</button>
    </div>
  </div>

  <div id="hint">Drag the top disk to another peg &nbsp;·&nbsp; Green = valid &nbsp;·&nbsp; Red = blocked</div>

  <div id="debug-stacks">
    <div class="debug-peg"><div class="debug-peg-label">Peg A</div><div class="debug-disks" id="debug-a"></div></div>
    <div class="debug-peg"><div class="debug-peg-label">Peg B</div><div class="debug-disks" id="debug-b"></div></div>
    <div class="debug-peg"><div class="debug-peg-label">Peg C</div><div class="debug-disks" id="debug-c"></div></div>
  </div>

  <button id="theme-toggle" title="Toggle day/night">🌙</button>

  <div id="win-overlay">
    <div class="win-card">
      <h2>Solved!</h2>
      <p>Completed in <strong><span id="win-moves">0</span> moves</strong></p>
      <p>Optimal solution: <strong><span id="win-min">0</span> moves</strong></p>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
